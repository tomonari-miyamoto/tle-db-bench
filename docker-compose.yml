# Benchmark-only stack. Both services get the same CPU/memory limits from .env.
# Image tags are pinned; bump them deliberately and record the change with your results.
services:
  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    cpus: ${CPU_LIMIT:-4}
    mem_limit: ${MEM_LIMIT:-8g}
    environment:
      CLICKHOUSE_DB: ${CH_DATABASE:-bench}
      CLICKHOUSE_USER: ${CH_USER:-bench}
      CLICKHOUSE_PASSWORD: ${CH_PASSWORD:?set CH_PASSWORD in .env}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "127.0.0.1:${CH_HTTP_PORT:-8123}:8123"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8123/ping || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  timescaledb:
    image: timescale/timescaledb:2.22.1-pg17
    cpus: ${CPU_LIMIT:-4}
    mem_limit: ${MEM_LIMIT:-8g}
    environment:
      POSTGRES_DB: ${PG_DATABASE:-bench}
      POSTGRES_USER: ${PG_USER:-bench}
      POSTGRES_PASSWORD: ${PG_PASSWORD:?set PG_PASSWORD in .env}
      TS_TUNE_MEMORY: ${TS_TUNE_MEMORY:-8GB}
      TS_TUNE_NUM_CPUS: ${TS_TUNE_NUM_CPUS:-4}
    ports:
      - "127.0.0.1:${PG_PORT:-5433}:5432"
    shm_size: 1gb
    volumes:
      - timescale_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

volumes:
  clickhouse_data:
  timescale_data:
