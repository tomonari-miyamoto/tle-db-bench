[project]
name = "tlebench"
version = "0.1.0"
description = "Benchmark harness: ClickHouse vs TimescaleDB bulk time-range retrieval of TLE-like records"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pyarrow>=17.0",
    "clickhouse-connect>=0.8.0",
    "psycopg[binary]>=3.2",
    "adbc-driver-manager>=1.3",
    "adbc-driver-postgresql>=1.3",
]

[project.scripts]
tlebench = "tlebench.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tlebench"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
